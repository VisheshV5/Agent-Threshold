[project]
name = "threshold-agent"
version = "0.1.0"
description = "Calibrated escalation middleware for AI agents: decides proceed / ask_human / abort before each tool call, with a measurable calibration curve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "matplotlib>=3.11.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "threshold"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
